<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mini Game Hub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0a0d1e; overflow: hidden; font-family: 'Courier New', monospace; }
  #phaser-parent { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  canvas { display: block; image-rendering: pixelated; }

  /* Shooter left/right DOM buttons — only visible during ShooterScene on narrow screens */
  #btn-left, #btn-right {
    position: fixed; bottom: 30px; z-index: 10; display: none;
  }
  #btn-left  { left: 16px; }
  #btn-right { right: 16px; }
  .ctrl-btn {
    width: 64px; height: 64px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.15); color: #fff; font-size: 22px; font-weight: bold;
    user-select: none; -webkit-user-select: none; touch-action: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .ctrl-btn:active { background: rgba(255,255,255,0.35); }
</style>
</head>
<body>
<div id="phaser-parent"></div>
<div class="ctrl-btn" id="btn-left">◀</div>
<div class="ctrl-btn" id="btn-right">▶</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

<!-- Hub utility + scenes — order matters: menu.js defines Hub before shooter.js uses it -->
<script src="js/menu.js"></script>
<script src="js/shooter.js"></script>
<script src="js/zombie.js"></script>

<script>
// ─── SHARED DIMS ─────────────────────────────────────────────────────────────
// W / H are declared in shooter.js (360×640 portrait) — used by Boot + Shooter.
// ZW / ZH are declared in zombie.js (960×540 landscape).
// The canvas boots at the portrait size; ZombieDefense calls
// scale.setGameSize(ZW, ZH) on entry and MainMenu restores 360×640,
// so each scene gets its own aspect ratio under Scale.FIT.

// ─── PHASER CONFIG ────────────────────────────────────────────────────────────
const config = {
  type: Phaser.AUTO,
  backgroundColor: '#0a0d1e',
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 0 }, debug: false }
  },
  scene: [
    BootScene,        // defined in shooter.js — loads assets, then goes to MainMenu
    MainMenuScene,    // defined in menu.js
    ShooterScene,     // defined in shooter.js
    ZombieDefenseScene // defined in zombie.js
  ],
  scale: {
    mode:       Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    parent:     'phaser-parent',
    // Use the shooter portrait size as the canvas base.
    // MainMenu + Zombie scenes query scale.width/height at runtime.
    width:  360,
    height: 640
  }
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
